name: CI

# A push or pull request that changes only the website skips this workflow;
# website.yml builds it instead. GitHub filters on the whole pushed range,
# so a push that also touches anything else runs every job. The Publish
# call (workflow_call) is never filtered.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
  pull_request:
    paths-ignore:
      - 'website/**'
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run
# (pushes to main, the call from Publish) gets a group of its own, so
# none is cancelled or left pending behind another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path tests/consumers/material-flow/Cargo.toml --all --check
      - run: cargo fmt --manifest-path tests/consumers/provider-streaming/Cargo.toml --all --check

  clippy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path tests/consumers/material-flow/Cargo.toml --features runtime --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path tests/consumers/provider-streaming/Cargo.toml --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo test also compiles the example targets, so this covers the
      # "examples stay buildable" guarantee without a separate job.
      - run: cargo test --workspace --locked
      - name: Public facade consumers
        run: |
          cargo test --manifest-path tests/consumers/material-flow/Cargo.toml --locked
          cargo test --manifest-path tests/consumers/material-flow/Cargo.toml --features runtime --locked
          cargo test --manifest-path tests/consumers/provider-streaming/Cargo.toml --locked

  msrv:
    # MSRV 1.96 is the declared floor (workspace rust-version); check
    # compiles everything without needing the full test run.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --manifest-path tests/consumers/material-flow/Cargo.toml --features runtime --all-targets --locked
      - run: cargo check --manifest-path tests/consumers/provider-streaming/Cargo.toml --all-targets --locked

  dependency-directions:
    # Architectural layering is machine-enforced, not
    # left to review.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/check-dependency-directions.sh
      - run: python3 .github/scripts/check-module-layout.py
      - run: python3 -m unittest discover -s .github/scripts -p 'test_guards.py'
      - name: Check unused dependencies
        uses: bnjbvr/cargo-machete@v0.9.2

  cargo-deny:
    # Advisories, licenses, duplicate versions and sources; deny.toml
    # holds the policy.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  breaking-changes:
    # Backs up the commit-msg hook: a breaking commit in the pushed range
    # needs a CHANGELOG.md change in the same range.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Breaking commits update CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check-commit-messages.py range "$BASE" "$HEAD"

  release-checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test release refusal and retry behavior
        run: python3 -m unittest discover -s .github/scripts -p 'test_release.py'
      - name: Feature matrix
        run: |
          cargo check -p causa --locked
          cargo check -p causa --no-default-features --locked
          cargo check -p causa --features full --locked
          cargo check -p causa-extension --no-default-features --locked
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
