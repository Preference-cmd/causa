name: Website

# The pages read their Rust code from tests/consumers/site-guides, so a
# change there rebuilds the site too. Their docs.rs links are checked
# against a local rustdoc build before the site deploys; ci.yml repeats the
# check when the crates change.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tests/consumers/site-guides/**'
      - '.github/workflows/website.yml'
      - '.github/scripts/check-docs-links.py'
  pull_request:
    paths:
      - 'website/**'
      - 'tests/consumers/site-guides/**'
      - '.github/workflows/website.yml'
      - '.github/scripts/check-docs-links.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-links:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: python3 .github/scripts/check-docs-links.py

  build:
    needs: docs-links
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: website
          command: deploy
          packageManager: pnpm
