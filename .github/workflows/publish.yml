name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Experimental version shared by all six crates
        required: true
        default: '0.0.1'
        type: string
      publish:
        description: Upload to crates.io (requires the matching vVERSION tag)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  # Check the exact selected commit, including Linux/macOS and the MSRV.
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check release version and family dependencies
        run: python3 .github/scripts/release.py check --version "$RELEASE_VERSION"
      - name: Verify every package together (also works before the first publish)
        run: cargo publish --workspace --dry-run --locked --registry crates-io
      - name: Check packaged licenses and README files
        run: python3 .github/scripts/release.py packages --version "$RELEASE_VERSION"
      - name: Publish missing versions from the release tag
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/release.py publish --version "$RELEASE_VERSION"
