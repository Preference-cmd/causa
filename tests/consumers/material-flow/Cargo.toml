[package]
name = "causa-material-flow-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[features]
default = []
runtime = ["causa/runtime"]

[dependencies]
causa = { path = "../../../crates/causa", default-features = false }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = "1"
