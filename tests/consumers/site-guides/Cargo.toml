[package]
name = "causa-site-guides"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
causa = { path = "../../../crates/causa", features = ["extension-mcp"] }
futures-util = "0.3"
# The in-process MCP server of the "Connect MCP servers" program.
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
