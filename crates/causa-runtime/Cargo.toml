[package]
name = "causa-runtime"
version.workspace = true
description = "Causa runtime — reference driver (turn loop, tool dispatch, streaming, approval pause/resume)"
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "tools", "streaming", "driver"]
categories = ["asynchronous"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
causa-kernel = { path = "../causa-kernel", version = "0.1" }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `fs` is example-only (FsConversationStore reference store): the lib's
# normal graph stays fs-free (first-principles item 7.5).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tempfile = { workspace = true }
# driver tests hash fixture payloads; blake3 stays out of the lib itself
blake3 = "1"
# tracing-span tests capture the driver's span baseline (Slice 6.6)
tracing-subscriber = { workspace = true }
