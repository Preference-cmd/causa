[package]
name = "reimagine-agent-mcp"
version.workspace = true
description = "MCP client for the agent-stack — dynamic tool sources over the context kernel ports"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reimagine-context-kernel = { path = "../context-kernel" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
rmcp = { workspace = true }

[dev-dependencies]
reimagine-agent-runtime = { path = "../agent-runtime" }
axum = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-async-rw",
    "transport-streamable-http-server",
] }
