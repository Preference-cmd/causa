[package]
name = "causa-extension"
version.workspace = true
description = "Causa extensions — DynamicToolSource adapters (MCP, …) over the causa-kernel ports"
repository.workspace = true
readme = "../../README.md"
keywords = ["mcp", "llm", "tools", "agent"]
categories = ["api-bindings", "asynchronous"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
causa-kernel = { path = "../causa-kernel", version = "0.1.3" }
async-trait = { workspace = true }
# Decoding MCP image content to raw bytes for host-side media ingest.
base64 = "0.22"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
rmcp = { workspace = true, optional = true }
# Parsing host-supplied HTTP header names and values for rmcp; already in the
# build through rmcp.
http = { version = "1", optional = true }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:http"]

[[example]]
name = "mcp_tools"
required-features = ["mcp"]

[[test]]
name = "integration"
required-features = ["mcp"]

# Starts copies of itself as the stdio MCP server, so it has its own main.
[[test]]
name = "stdio_stderr"
harness = false
required-features = ["mcp"]

[dev-dependencies]
causa-runtime = { path = "../causa-runtime", version = "0.1.3" }
uuid.workspace = true
axum = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "rt-multi-thread", "macros", "time"] }
tracing-subscriber = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-async-rw",
    "transport-streamable-http-server",
] }

[lints]
workspace = true
