[package]
name = "causa-provider"
version.workspace = true
description.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["anthropic", "openai", "llm", "api-client", "reqwest"]
categories = ["api-bindings"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
causa-protocol = { path = "../causa-protocol", version = "0.1.4" }
causa-kernel = { path = "../causa-kernel", version = "0.1.4" }
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true }
# HTTP-date form of the `retry-after` response header
httpdate = { workspace = true }

[dev-dependencies]
causa-runtime = { path = "../causa-runtime", version = "0.1.4" }
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
wiremock = "0.6"
# `agent.http` span assertions
tracing-subscriber = { workspace = true }

[lints]
workspace = true
